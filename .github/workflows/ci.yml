name: CI

on:
  push:
  pull_request:

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Repository checks
        run: python3 scripts/check_repo.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      # Task 005: proof-diagnostics MVP. Runs on the committed, sanitized
      # GNATprove 16.1.0 fixtures (diagnostics/tests/fixtures); no toolchain.
      - name: Proof-diagnostics tests (SRD001-SRD003)
        working-directory: diagnostics
        run: python3 -m unittest discover -s tests -t tests -v

  # Task 006: the installable `spark-refine` CLI. No Ada toolchain: builds
  # the wheel from diagnostics/pyproject.toml, checks that it holds only
  # the spark_refine_diagnostics package + metadata (no tests/fixtures),
  # installs it into an isolated venv and runs the console script from a
  # temporary directory OUTSIDE the repository on absolute fixture paths
  # (rules, explain, analyze alias, compare-provers, discovery with one /
  # zero / two result sets; Task 008: prove --dry-run and prove with a fake
  # GNATprove). Repeated for an editable install.
  diagnostics-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: "Wheel: build, inspect, install, run outside the repository"
        run: python3 diagnostics/scripts/packaging_smoke.py
      - name: "Editable install: run outside the repository"
        run: python3 diagnostics/scripts/packaging_smoke.py --editable
      - name: Oldest supported Python (3.11) runs the fixture suite
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Proof-diagnostics tests on Python 3.11
        working-directory: diagnostics
        run: python3 -m unittest discover -s tests -t tests

  # Task 005: small FRESH end-to-end diagnostics gate. Complements (does not
  # replace) the fixture-based suite above: runs the pinned toolchain now,
  # through the benchmarks' own unchanged scripts, on exactly three cases,
  # and analyses the fresh SARIF/.spark/.ali with the diagnostics CLI:
  #   E2E-A  SRD001  ring buffer B3 head_advances_wrong
  #   E2E-B  SRD002  ring buffer no_is_full_post (fresh .ali -> ali.py)
  #   E2E-C  SRD003  library-backed fixed pool, cvc5 / z3 / altergo alone
  #   E2E-D  prove   (Task 008) fresh ring buffer baseline, exit 0
  #   E2E-E  prove   (Task 008) ring buffer B3, GNATprove exit 1, SRD001
  # Pass criteria are structural (codes, entities, rules, confidence,
  # dependency_source, match_quality); diagnostic prose is never checked.
  # Independent of the proof jobs, which are unchanged.
  diagnostics-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: alire-project/setup-alire@v6.0.0
        with:
          version: '2.1.1'
          toolchain: '--disable-assistant'
      # Same resolution and build as the proof jobs, once per crate used
      # below. The build is required: it creates SPARKlib's library
      # directory, without which gnatprove cannot load sparklib.gpr on a
      # fresh runner.
      - name: Resolve pinned toolchain and build (ring buffer)
        working-directory: examples/ring_buffer
        run: |
          alr -n update
          alr -n exec -- gnat --version | head -1
          alr -n exec -- gnatprove --version
          alr -n build
      - name: Resolve pinned toolchain and build (fixed pool, library-backed)
        working-directory: examples/fixed_pool
        run: |
          alr -n update
          alr -n exec -- gnat --version | head -1
          alr -n exec -- gnatprove --version
          alr -n build -- -XFIXED_POOL_SRC=variants/library_backed -XFIXED_POOL_VARIANT=library_backed
      - name: "E2E-A: SRD001 on fresh ring buffer B3 output"
        run: python3 diagnostics/scripts/e2e_fresh.py srd001
      - name: "E2E-B: SRD002 on fresh ring buffer no_is_full_post output (.ali)"
        run: python3 diagnostics/scripts/e2e_fresh.py srd002
      - name: "E2E-C: SRD003 on fresh single-prover fixed-pool runs"
        run: python3 diagnostics/scripts/e2e_fresh.py srd003
      # Task 008: `spark-refine prove` launches GNATprove itself (no
      # --results) and must pick the ONE result set its run wrote, ignoring
      # the stale ones left above plus a stale decoy.
      - name: "E2E-D: spark-refine prove, fresh ring buffer baseline"
        run: python3 diagnostics/scripts/e2e_fresh.py prove
      - name: "E2E-E: spark-refine prove, GNATprove exit 1 on B3, still diagnosed"
        run: python3 diagnostics/scripts/e2e_fresh.py prove_negative
      - name: Upload fresh diagnostics reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-e2e-reports
          path: |
            diagnostics/obj/e2e/*.json
            examples/ring_buffer/obj/negative_htc_head_advances_wrong/gnatprove.log
            examples/ring_buffer/obj/ablation_no_is_full_post/gnatprove.log
            examples/fixed_pool/obj/prover_library_backed_*/gnatprove.log
            examples/ring_buffer/obj/negative_htc_head_advances_wrong/gnatprove/gnatprove.sarif
            examples/ring_buffer/obj/ablation_no_is_full_post/gnatprove/gnatprove.sarif
            examples/fixed_pool/obj/prover_library_backed_*/gnatprove/gnatprove.sarif
            examples/ring_buffer/obj/baseline/gnatprove/gnatprove.sarif
            examples/ring_buffer/obj/e2e_prove_b3/gnatprove/gnatprove.sarif
          if-no-files-found: warn

  # Task 009: OPTIONAL Libadalang semantic enrichment of SRD002, isolated
  # from every other job (none of them installs Libadalang). Libadalang is
  # not on PyPI: diagnostics/scripts/setup_libadalang.sh builds the Alire
  # crate libadalang=26.0.0 (pinned dependency solution, GNAT 15.3.1) once
  # (~4 min on 32 cores locally; longer on a runner) and bundles it
  # relocatably; the bundle is cached by the script's hash. Then:
  #   - the full diagnostics suite INCLUDING the Libadalang tests on the
  #     committed semantic snapshots (tests/semantic_fixtures), under
  #     `alr exec` of the ring buffer (SPARKlib project for the snapshots);
  #   - E2E-F: fresh no_is_full_post ablation + explain --semantic.
  diagnostics-semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: alire-project/setup-alire@v6.0.0
        with:
          version: '2.1.1'
          toolchain: '--disable-assistant'
      - name: Cache the Libadalang bundle
        id: lal-cache
        uses: actions/cache@v4
        with:
          path: ~/lal-bundle/python
          key: libadalang-26.0.0-${{ runner.os }}-${{ hashFiles('diagnostics/scripts/setup_libadalang.sh') }}
      - name: Build the Libadalang bundle (cache miss only)
        if: steps.lal-cache.outputs.cache-hit != 'true'
        run: |
          time bash diagnostics/scripts/setup_libadalang.sh ~/lal-bundle
          rm -rf ~/lal-bundle/build
      - name: Enable the bundle
        run: |
          echo "PYTHONPATH=$HOME/lal-bundle/python" >> "$GITHUB_ENV"
          PYTHONPATH=$HOME/lal-bundle/python python3 -c 'import libadalang; print(libadalang.__file__)'
          du -sh ~/lal-bundle/python
      - name: Resolve pinned toolchain and build (ring buffer)
        working-directory: examples/ring_buffer
        run: |
          alr -n update
          alr -n build
      - name: Diagnostics suite with Libadalang (no skips allowed)
        working-directory: examples/ring_buffer
        run: |
          set -o pipefail
          alr -n exec -- python3 -m unittest discover -s ../../diagnostics/tests -t ../../diagnostics/tests -v 2>&1 | tee /tmp/semantic-tests.log
          ! grep -E "\.\.\. skipped|^OK \(skipped" /tmp/semantic-tests.log
      - name: "E2E-F: SRD002 + Libadalang semantic enrichment (fresh)"
        run: python3 diagnostics/scripts/e2e_fresh.py semantic
      - name: Upload semantic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-semantic-report
          path: diagnostics/obj/e2e/semantic.json
          if-no-files-found: warn

  # Ring-buffer proof benchmarks, one toolchain setup for both
  # representations:
  #   A  Task 001  Content + First + Length        (src/)
  #   B  Task 002  Content + Head + Tail + Count   (variants/head_tail_count/)
  # Toolchain is pinned in examples/ring_buffer/alire.toml
  # (gnat_native = gnatprove = sparklib = 16.1.0, gprbuild = 26.0.1).
  # The job is green only if, for each representation, it builds, the same
  # runtime tests pass (with and without -gnata), the positive proof has
  # 0 unproved / 0 justified checks and every negative fixture fails in the
  # expected (rule, entity) obligation; and, in common, the public API is
  # identical, the client proof and runtime tests are unchanged since the
  # Task 002 base, no forbidden trust construct is present, and both proof
  # inventories are consistent. Proof results are verified from GNATprove's
  # SARIF/.spark output, not from exit codes.
  spark-ring-buffer-baseline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/ring_buffer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the representation-independence check diffs against the Task 002 base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Repository checks
        working-directory: .
        run: |
          python3 scripts/check_repo.py
          python3 -m unittest discover -s tests -v
      - uses: alire-project/setup-alire@v6.0.0
        with:
          version: '2.1.1'
          toolchain: '--disable-assistant'
      - name: Resolve pinned toolchain
        run: |
          alr -n update
          alr -n exec -- gnat --version | head -1
          alr -n exec -- gnatprove --version
      # ---- common controls ----------------------------------------------
      - name: Public API equivalence (A vs B visible part)
        run: python3 scripts/check_public_api_equivalence.py
      - name: Client proof and runtime tests unchanged since Task 002 base
        run: |
          git diff --exit-code 0f6da9702ab5683157efa855df80e7c562c53d95 -- \
            proof/ring_buffer_client_proof.ads \
            proof/ring_buffer_client_proof.adb \
            tests/ring_buffer_runtime_tests.adb
      - name: Proof-support inventories are consistent (A and B)
        run: python3 scripts/proof_inventory.py --all
      - name: Trust / forbidden-assumption scan (A, B, proof, tests, fixtures)
        run: python3 scripts/check_proof_results.py trust-scan
      # ---- representation A: Task 001 (First + Length) ------------------
      - name: "A: build"
        run: alr -n build
      - name: "A: runtime tests (production build)"
        run: ./bin/ring_buffer_runtime_tests
      - name: "A: runtime tests (contracts and ghost model executed, -gnata)"
        run: |
          alr -n build -- -XRING_BUFFER_ASSERTIONS=on
          ./bin/assertions/ring_buffer_runtime_tests
      - name: "A: positive GNATprove baseline"
        run: python3 scripts/check_proof_results.py positive
      - name: "A: negative proof fixtures (N1-N5)"
        run: python3 scripts/check_proof_results.py negative
      # ---- representation B: Task 002 (Head + Tail + Count) -------------
      - name: "B: build"
        run: alr -n build -- -XRING_BUFFER_REPR=head_tail_count
      - name: "B: same runtime tests (production build)"
        run: ./bin/head_tail_count/ring_buffer_runtime_tests
      - name: "B: same runtime tests (contracts, invariant and ghost model executed, -gnata)"
        run: |
          alr -n build -- -XRING_BUFFER_REPR=head_tail_count -XRING_BUFFER_ASSERTIONS=on
          ./bin/head_tail_count/assertions/ring_buffer_runtime_tests
      - name: "B: positive GNATprove"
        run: python3 scripts/check_proof_results.py positive --variant head_tail_count
      - name: "B: negative proof fixtures (B1-B6)"
        run: python3 scripts/check_proof_results.py negative --variant head_tail_count
      - name: Upload proof results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ring-buffer-proof-results
          path: |
            examples/ring_buffer/obj/baseline/proof_summary.json
            examples/ring_buffer/obj/baseline/gnatprove/gnatprove.out
            examples/ring_buffer/obj/baseline/gnatprove/gnatprove.sarif
            examples/ring_buffer/obj/head_tail_count/proof_summary.json
            examples/ring_buffer/obj/head_tail_count/gnatprove/gnatprove.out
            examples/ring_buffer/obj/head_tail_count/gnatprove/gnatprove.sarif
            examples/ring_buffer/obj/*/gnatprove.log
            examples/ring_buffer/obj/negative_summary.json
            examples/ring_buffer/obj/negative_summary_head_tail_count.json
          if-no-files-found: warn

  # Task 003: fixed object pool (free-index stack refined against a
  # SPARK.Containers.Functional.Sets free set). Independent of the
  # ring-buffer job; same pinned toolchain family (see
  # examples/fixed_pool/alire.toml) and same proof switches. Green only if it
  # builds, runtime tests pass with and without -gnata, the proof inventory
  # partitions the sources, no forbidden trust construct is present, the
  # positive proof has 0 unproved / 0 justified checks (from SARIF/.spark),
  # and each negative fixture P1-P6 fails at its expected (rule, entity).
  spark-fixed-pool-baseline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/fixed_pool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Repository checks
        working-directory: .
        run: python3 scripts/check_repo.py
      - uses: alire-project/setup-alire@v6.0.0
        with:
          version: '2.1.1'
          toolchain: '--disable-assistant'
      - name: Resolve pinned toolchain
        run: |
          alr -n update
          alr -n exec -- gnat --version | head -1
          alr -n exec -- gnatprove --version
      - name: Proof inventory is consistent
        run: python3 scripts/proof_inventory.py
      - name: Trust / forbidden-assumption scan
        run: python3 scripts/check_proof_results.py trust-scan
      - name: Build
        run: alr -n build
      - name: Runtime tests (production build)
        run: ./bin/fixed_pool_runtime_tests
      - name: Runtime tests (contracts, invariant and ghost set model executed, -gnata)
        run: |
          alr -n build -- -XFIXED_POOL_ASSERTIONS=on
          ./bin/assertions/fixed_pool_runtime_tests
      - name: Positive GNATprove gate
        run: python3 scripts/check_proof_results.py positive
      - name: Negative proof fixtures (P1-P6)
        run: python3 scripts/check_proof_results.py negative
      - name: Upload proof results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-pool-proof-results
          path: |
            examples/fixed_pool/obj/baseline/proof_summary.json
            examples/fixed_pool/obj/baseline/gnatprove/gnatprove.out
            examples/fixed_pool/obj/baseline/gnatprove/gnatprove.sarif
            examples/fixed_pool/obj/*/gnatprove.log
            examples/fixed_pool/obj/negative_summary.json
          if-no-files-found: warn

  # Task 004: the same fixed pool (same public spec, production code, client
  # proof and runtime tests) with its proof support moved into the reusable
  # generic library proof_patterns/ (SPARK_Refine_Prefix_Sets). Independent
  # of the Task 003 job above, which keeps gating the manual baseline.
  # Green only if: the visible spec is token-identical to Task 003, the
  # client proof and runtime tests are byte-identical to the Task 004 base,
  # both inventories partition their sources, the trust scan (incl. the
  # library) passes, the library-backed build passes the same runtime tests
  # with and without -gnata, the library-backed proof has 0 unproved /
  # 0 justified, L1-L6 fail at their expected (rule, entity), and the
  # independent validation instances of the library prove.
  spark-fixed-pool-library-backed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/fixed_pool
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the unchanged-controls check diffs against the Task 004 base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Repository checks
        working-directory: .
        run: python3 scripts/check_repo.py
      - uses: alire-project/setup-alire@v6.0.0
        with:
          version: '2.1.1'
          toolchain: '--disable-assistant'
      - name: Resolve pinned toolchain
        run: |
          alr -n update
          alr -n exec -- gnat --version | head -1
          alr -n exec -- gnatprove --version
      # ---- controls ------------------------------------------------------
      - name: Public API equivalence (manual vs library-backed visible part)
        run: python3 scripts/check_public_api_equivalence.py
      - name: Client proof and runtime tests unchanged since Task 004 base
        run: |
          git diff --exit-code 47a431c4e375a93372ed7f39daafdfb1cb768d8f -- \
            proof/fixed_pool_client_proof.ads \
            proof/fixed_pool_client_proof.adb \
            tests/fixed_pool_runtime_tests.adb \
            src/fixed_pool.ads \
            src/fixed_pool.adb \
            negative/
      - name: Proof inventories are consistent (manual P and library-backed R, L, A)
        run: python3 scripts/proof_inventory.py --all
      - name: Trust / forbidden-assumption scan (incl. reusable library)
        run: python3 scripts/check_proof_results.py trust-scan
      # ---- library-backed variant ---------------------------------------
      - name: "Library-backed: build"
        run: alr -n build -- -XFIXED_POOL_SRC=variants/library_backed -XFIXED_POOL_VARIANT=library_backed
      - name: "Library-backed: same runtime tests (production build)"
        run: ./bin/fixed_pool_runtime_tests
      - name: "Library-backed: same runtime tests (-gnata, library ghost model executed)"
        run: |
          alr -n build -- -XFIXED_POOL_SRC=variants/library_backed -XFIXED_POOL_VARIANT=library_backed -XFIXED_POOL_ASSERTIONS=on
          ./bin/assertions/fixed_pool_runtime_tests
      - name: "Library-backed: positive GNATprove gate"
        run: python3 scripts/check_proof_results.py positive --variant library_backed
      - name: "Library-backed: negative proof fixtures (L1-L6)"
        run: python3 scripts/check_proof_results.py negative --variant library_backed
      - name: "Reusable library: resolve its (identical) pinned toolchain"
        working-directory: proof_patterns
        run: alr -n update
      - name: "Reusable library: independent validation instances"
        run: python3 scripts/check_proof_results.py library-validation
      - name: Upload proof results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-pool-library-backed-proof-results
          path: |
            examples/fixed_pool/obj/library_backed/proof_summary.json
            examples/fixed_pool/obj/library_backed/gnatprove/gnatprove.out
            examples/fixed_pool/obj/library_backed/gnatprove/gnatprove.sarif
            examples/fixed_pool/obj/*/gnatprove.log
            examples/fixed_pool/obj/negative_summary_library_backed.json
            proof_patterns/validation/obj/validation_summary.json
            proof_patterns/validation/obj/gnatprove/gnatprove.out
          if-no-files-found: warn

# Provenance of every diagnostics fixture. Consumed by
# diagnostics/scripts/capture_fixtures.py (produce/collect) and by the
# tests (the fixture set must equal this list).
#
#   example   examples/<example>
#   obj       examples/<example>/obj/<obj>/gnatprove holds the raw output
#   producer  "benchmark": made by the benchmark's own scripts (negative
#                          gates, ablation scripts, prover_matrix.py); the
#                          exact commands are in README.md
#             "gate":      positive gate of `variant`
#             "case":      run by capture_fixtures.py through the example's
#                          ablation run_case, applying `edits` in order;
#                          each edit is "fault:<dir with fault.toml>" or
#                          "ablation:<variant>:<case>"
#   switches  extra gnatprove switches (case only)
#   extra_sources  fixture-only Ada units (dirs relative to diagnostics/)
#                  staged next to src/ under obj/ (case only, fixed_pool)
#
# Ring buffer B ground truth uses the repository's control case
# control_push_ignores_tail_no_invariant (no invariant, Push computes its
# slot from Head/Count instead of reading Tail; 116/116 proved without a
# fault). Removing the invariant alone breaks the Push postcondition even
# without a fault (ablation no_type_invariant), which would make every Push
# fault look "confirmed". With the control, B3/B4 confirm and B1/B2/B6 do
# not.

# ---- SRD001: ring buffer representation B (Task 002) ----------------------
[ring_b1]
example = "ring_buffer"
obj = "negative_htc_tail_not_advanced"
producer = "benchmark"

# ---- SRD002: false client assertion control (Task 005 corrective) ----------
# The unchanged, fully proved Task 003 pool plus one extra client unit
# (tests/fixture_sources/fixed_pool_false_client) whose assertion is simply
# false (Initialize; pragma Assert (Free_Count (P) = 0)). No public contract
# is insufficient here: SRD002 must fire as a client-only proof gap at LOW
# confidence and must not claim a contract deficiency.
[pool_false_client_assert]
example = "fixed_pool"
obj = "ablation_false_client_assert"
producer = "case"
variant = "baseline"
edits = []
extra_sources = ["tests/fixture_sources/fixed_pool_false_client"]


# Hand-written expectations for every fixture in fixtures/manifest.toml.
#
# diagnostics  exact multiset of "CODE:entity" the analyzer must emit for
#              `analyze` on this fixture (SRD003 is tested in
#              test_srd003.py because it needs several runs)
#
# [<fixture>.ground_truth]   SRD001 evaluation metadata (never read by the
#                            analyzer). Two separate questions:
#   masking_risk                   does the fixture have an unproved
#                                  invariant + a proved postcondition of
#                                  the same entity (what SRD001 promises)?
#   secondary_failure_confirmed    is a proved postcondition of that entity
#                                  actually false?
#   basis   "differential": re-proved with the invariant removed
#               (`mask` fixture), a VC_POSTCONDITION of the entity is
#               unproved there and NOT unproved in the no-fault run with the
#               invariant removed (`mask_baseline`). Compared per
#               (rule, entity): failed and proved checks of one contract
#               are reported at different columns.
#           "equivalence": the fault's source edits are byte-identical to
#               those of `equivalent_to`, which is differentially confirmed,
#               and the entity has the same contract; the differential is
#               not usable because `mask_baseline` already fails that
#               postcondition without any fault.
#           "differential-negative": the mask run shows no postcondition
#               failure of the entity beyond the mask baseline.
#   masked  [rule, entity] pairs whose masking is confirmed

# ---- ring buffer B (Task 002) ----------------------------------------------
[ring_b1]
diagnostics = ["SRD001:Ring_Buffer.Push"]
[ring_b1.ground_truth]
masking_risk = true
secondary_failure_confirmed = false
basis = "differential-negative"
mask = "ring_b1_mask"
mask_baseline = "ring_b_mask_baseline"
masked = []


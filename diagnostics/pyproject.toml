# Task 006: installable packaging for the spark-refine diagnostics CLI.
#
#   python3 -m pip install ./diagnostics        # normal install
#   python3 -m pip install -e ./diagnostics     # development install
#   spark-refine rules
#
# Runtime dependencies: none (Python standard library only). setuptools is
# a build-time requirement only.
#
# The wheel contains ONLY the spark_refine_diagnostics package plus
# metadata (README, LICENSE). The ~5.5 MB fixture corpus (tests/fixtures),
# the test suite, scripts/ and obj/ are never packaged; see MANIFEST.in
# and tests/test_packaging.py.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-refine"
dynamic = ["version"]
description = "Proof-aware diagnostics for SPARK/GNATprove results (part of spark-refine)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "spark-refine contributors" }]
keywords = ["spark", "ada", "gnatprove", "formal-verification", "diagnostics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Ada",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/zackboll/spark-refine"
Documentation = "https://github.com/zackboll/spark-refine/blob/main/docs/AGENT_INTEGRATION.md"

[project.scripts]
spark-refine = "spark_refine_diagnostics.cli:main"

[tool.setuptools]
# Explicit list: no automatic discovery, so tests/, scripts/ and obj/ can
# never be picked up as packages.
packages = ["spark_refine_diagnostics"]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "spark_refine_diagnostics.__version__" }

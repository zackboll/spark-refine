# Machine-readable classification of the Task 003 fixed-pool sources.
#
# Every non-blank, non-comment line of src/*.ad[sb] is counted exactly once.
# Lines not covered by an [[artifact]] range are "production".
# `anchor` must occur on the first line of the range; scripts/proof_inventory.py
# fails if any range drifts, overlaps another, or covers blank/comment-only
# text, so the numbers in BASELINE_METRICS.md cannot silently go stale.
#
# group:
#   specification  authoritative, developer-owned abstract requirement
#                  (NOT a generator target; not counted in P)
#   mechanical     proof/refinement support (counted in P)
#
# category (mechanical only), per Task 003 section 25:
#   model_construction, representation_invariant, membership_mapping,
#   cardinality_relation, helper_lemma, loop_invariant,
#   operation_refinement_contract, proof_assertion, proof_only_helper,
#   proof_only_state_update, other
#
# generic = true only if another conventional free-index-stack pool (with a
# different payload) would need essentially the same fact.
# `ablation` names the case in scripts/ablate_proof_support.py whose result
# demonstrates necessity (see BASELINE_METRICS.md section 6).


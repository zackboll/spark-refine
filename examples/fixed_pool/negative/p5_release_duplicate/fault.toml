id = "P5"
name = "p5_release_duplicate"
description = """
Release pushes the current top-of-stack identity again (when the stack is
non-empty) instead of Id, creating a duplicate entry in the active free
prefix: the same identity would later be allocated twice."""

[[edit]]
file = "fixed_pool.adb"
find = "      P.Free_Stack (P.Top) := Id;"
replace = "      P.Free_Stack (P.Top) := (if P.Top > 1 then P.Free_Stack (P.Top - 1) else Id);"

# The active-prefix uniqueness invariant fails on exit from Release.
[[expect]]
rule = "VC_INVARIANT_CHECK"
entity = "Fixed_Pool.Release"

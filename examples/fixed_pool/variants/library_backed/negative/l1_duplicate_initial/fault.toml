id = "L1"
name = "l1_duplicate_initial"
baseline_equivalent = "P1"
description = """
Library-backed equivalent of P1 (identical edit). Initialize builds a free
stack whose first two active entries are both 1 (identity 2 never appears),
so one identity is free twice and could be allocated twice."""

[[edit]]
file = "fixed_pool.adb"
find = "P := (Free_Stack => [for I in Object_Id => I],"
replace = "P := (Free_Stack => [for I in Object_Id => (if I = 2 then 1 else I)],"

# The library-provided uniqueness invariant fails on exit from Initialize.
[[expect]]
rule = "VC_INVARIANT_CHECK"
entity = "Fixed_Pool.Initialize"

# Machine-readable classification of the Task 001 manual baseline sources.
#
# Every non-blank, non-comment line of src/*.ad[sb] is counted exactly once.
# Lines not covered by an [[artifact]] range below are "production".
# `anchor` must occur on the first line of the range; scripts/proof_inventory.py
# fails if any range drifts, overlaps another, or covers blank/comment-only
# text, so the numbers in BASELINE_METRICS.md cannot silently go stale.
#
# group:
#   specification  authoritative, developer-owned abstract requirement
#                  (NOT a generator target)
#   mechanical     proof/refinement support (the future generation target)
#
# category (mechanical only) is one of:
#   model_construction, representation_predicate, proof_index_mapping,
#   helper_lemma, loop_invariant, operation_refinement_contract,
#   proof_only_state_update, other
#
# The Model Refined_Post (abstraction relation) is recorded under
# operation_refinement_contract: it is the refinement contract every
# operation proof depends on. The operations themselves need none.

